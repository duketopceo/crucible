# ── File index ──────────────────────────────────────────────────────────────
# One entry per tracked file. Verified by `scripts/build_indexes.py --verify`
# (CI gate). Entries maintained by hand until the auto-generator lands.
#
# Rules:
# - `breaks_if_changed` describes what breaks, not what the file contains.
# - `verification` lists the tests that must pass after a change.
# ────────────────────────────────────────────────────────────────────────────


[project]
name = "crucible"
version = "0.1.0"
description = "Research-grounded synthetic industrial-data platform. First reference model: Archify Foundry Twin (generic investment-casting line)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luke Kimball" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
sim = ["simpy>=4.1"]
transport = ["paho-mqtt>=2.1"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "invariant: structural rules that must never be violated",
    "scenario: golden scenario end-to-end runs",
]
